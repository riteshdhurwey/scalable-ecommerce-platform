syntax = "proto3";

package  order;

option go_package = "github.com/riteshdhurwey/scalable-ecommerce-platform/proto/order";

message OrderID {
    int64 orderID = 1;
}

message GetOrderStatusRequest{
    repeated OrderID OrderIDs = 1;
}

message OrderState {
    int64 orderID = 1;
    bool  orderExpired = 2;
}

message GetOrderStatusResponse {
    repeated OrderState OrderStates = 1;
}

service OrderService {
    rpc GetOrderStatus(GetOrderStatusRequest)
        returns (GetOrderStatusResponse);
}